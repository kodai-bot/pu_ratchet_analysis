name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - name: Download dataset (Zenodo 7847839, v1.0.0)
        run: |
          curl -fsSL -o dataset.tar.gz \
            https://zenodo.org/api/records/7847839/files/Procedural.unit.dataset-1.0.tar.gz/content
          echo "30e0dd45fc9315526a68c8de79905684e02acacf6ae3911a698d9e84eaf873a6  dataset.tar.gz" | sha256sum -c
          tar xzf dataset.tar.gz
      - name: Run analysis
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/supplementary_pu_acceleration_analysis.py \
            "Procedural.unit.dataset-1.0/Dataset/procedural units obfus.csv" > output.txt
      - name: Compare with expected output
        run: diff -u expected/output.txt output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: figure
          path: fig_pu_acceleration.pdf
